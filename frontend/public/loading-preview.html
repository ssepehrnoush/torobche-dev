<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8" />
<title>تربچه، دو مدلِ لودینگ</title>
<style>
  @font-face { font-family: Vazirmatn; src: local(Vazirmatn); }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: #faf7f2; font-family: Vazirmatn, Tahoma, sans-serif; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .card h2 { font-size: 15px; font-weight: 800; color: #3a3630; margin: 0; }
  .card p { font-size: 12.5px; color: #8a8378; margin: 0; max-width: 240px; text-align: center; line-height: 1.8; }

  .logo-spin { display: inline-flex; animation: logospin 1.6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes logospin {
    0% { transform: rotate(0deg) scale(.92); opacity: .5; filter: saturate(.5) brightness(1.1); }
    50% { transform: rotate(180deg) scale(1.06); opacity: 1; filter: saturate(1.4) brightness(1); }
    100% { transform: rotate(360deg) scale(.92); opacity: .5; filter: saturate(.5) brightness(1.1); }
  }

  .mascot-spin { display: flex; flex-direction: column; align-items: center; }
  .mascot-spin img { width: 128px; height: 128px; object-fit: contain; animation: mascotwalk .9s ease-in-out infinite; }
  .mascot-spin .mascot-ball { width: 26px; height: 26px; border-radius: 50%; margin-top: -14px;
    background: radial-gradient(circle at 35% 30%, #e91e33, #8f0f1f); animation: mascotball .9s ease-in-out infinite; }
  @keyframes mascotwalk { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-9px) rotate(3deg); } }
  @keyframes mascotball { 0%, 100% { transform: translateX(12px) rotate(0deg) scale(1); } 50% { transform: translateX(-12px) rotate(220deg) scale(.92); } }
</style>
</head>
<body>
  <div class="card">
    <h2>مدلِ الف، فقط خودِ لوگو می‌چرخد</h2>
    <span class="logo-spin">
      <svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true">
        <path fill="#e91e33" d="M79.245 20.322l-.627.726c-2.474 2.656-5.814 4.2-9.462 4.313-.16.023-.342.023-.502.023-.456 0-.878-.023-1.31-.068 8.595 10.1 9.895 24.968 2.222 36.579-7.638 11.542-21.774 16.252-34.428 12.484h-.08c-5.13-1.34-10.944.68-14.022 5.414 3.192-4.847 2.736-11.055-.798-15.322v-.045c-8.333-10.079-9.473-24.72-1.87-36.16C26.692 15.67 42.766 11.22 56.195 17.031c-.57-1.476-.935-3.065-1.026-4.688-.114-2.95.741-5.788 2.371-8.171-18.012-5.902-38.532.567-49.476 17.137C-5.104 41.171.425 67.842 20.261 80.893c19.882 13.064 46.592 7.502 59.702-12.246 10.032-15.174 9.177-34.331-.707-48.348l-.011.023z" />
        <path fill="#bf0f22" d="M31.969 10.22c-10.91 1.08-20.463 5.721-24.054 11.191C-5.195 41.216.3 67.853 20.193 80.905l.73-1.112c3.191-4.847 2.735-11.055-.799-15.322v-.045c-8.22-10.079-9.36-24.72-1.835-36.16C26.61 15.67 42.685 11.22 56.114 17.031c0 0-11.4-8.059-24.122-6.81h-.023z" />
        <path fill="#6fbc23" d="M62.544 22.32s-.342-4.086 1.482-7.037c1.824-2.951 5.7-5.845 10.602-5.539 4.925.307 5.723 1.442 5.723 1.442s.114 3.972-1.254 6.242-4.218 5.606-8.322 6.446c-4.104.829-8.231-1.555-8.231-1.555z" />
        <path fill="#519a23" d="M61.062 21.173s-.456-3.972 2.28-7.944c2.736-3.973 5.7-4.563 5.7-4.563S68.7 3.218 66.078.608c.228-.057-3.124.08-6.042 3.291-2.577 2.815-4.104 7.264-2.964 11.577 1.14 4.312 3.99 5.697 3.99 5.697z" />
      </svg>
    </span>
    <p>دارم صفحهٔ بعد رو می‌سازم… هم می‌چرخد هم با اپاسیتی و اشباعِ رنگ نفس می‌کشد.</p>
  </div>

  <div class="card">
    <h2>مدلِ ب، آدمکِ ترب که لوگو را مثلِ توپ قل می‌دهد</h2>
    <span class="mascot-spin">
      <img src="/img/mascot-loading.png" alt="" />
      <i class="mascot-ball"></i>
    </span>
    <p>لوگو به نمای آدمکِ انسانی درآمده، راه می‌رود و توپِ ترب را جلو می‌دهد.</p>
  </div>
</body>
</html>
